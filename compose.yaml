# ==============================================================================
# Development PostgreSQL Service for AICTE Orchestration Platform
# NOTE: For local development only. Do not expose publicly or use in production.
# ==============================================================================
services:
  postgres:
    image: postgres:18-alpine
    container_name: aicte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aicte_platform_db}
      POSTGRES_USER: ${DB_USER:-aicte_app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aicte_123}
    ports:
      # Bound strictly to localhost to prevent public exposure
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    driver: local
